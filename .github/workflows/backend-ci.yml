name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test
        env:
          JWT_SECRET: ci-test-secret

      - name: Verify the server actually boots (build check)
        run: |
          JWT_SECRET=ci-test-secret PORT=5001 node server.js &
          SERVER_PID=$!
          sleep 3
          curl --fail http://localhost:5001/ || (echo "Server did not respond" && exit 1)
          kill $SERVER_PID